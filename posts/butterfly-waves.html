<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>butterfly waves - dylanholm.es</title>
    <meta name="description" content="Generative wave patterns driven by the butterfly curve equation">
    <link rel="stylesheet" href="../style.css">
    <style>
        #ugl-container {
            width: 100%;
            margin: 2rem 0;
        }
        #ugl-container canvas {
            display: block;
            width: 100% !important;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1><a href="/">dylanholm.es</a></h1>
            <nav>
                <a href="/about.html">/about</a>
                <a href="/resume.html">/resume</a>
            </nav>
        </header>

        <main>
            <article>
                <h1>butterfly waves</h1>
                <p>generative wave patterns driven by the butterfly curve equation.</p>

                <div id="ugl-container"></div>

                <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/88/three.min.js" integrity="sha256-6fhm481uY9c152qGWIVgE7KbzaCj5WjCi3BGIpZef2E=" crossorigin="anonymous"></script>
                <script id='vertex-shader' type="x-shader/x-vertex">
                    uniform float time;
                    uniform vec2 resolution;
                    void main() {
                        gl_Position = vec4( position, 1.0 );
                    }
                </script>
                <script id='fragment-shader' type="x-shader/x-fragment">
                    uniform float time;
                    uniform vec2 resolution;

                    vec2 butterfly(float t) {
                        float st = sin(t);
                        float ct = cos(t);
                        float f = exp(ct)-2.0*cos(4.0*t)-pow(sin(t/12.0),5.0);
                        return vec2(st*f, ct*f);
                    }

                    void main() {
                        vec2 uv = gl_FragCoord.xy / resolution.y;
                        float ratio = resolution.x / resolution.y;

                        float x = distance(uv,
                           0.1*butterfly(time+butterfly(time*0.1).x+butterfly(2.0*uv.x).x+2.0*butterfly(uv.y).y)
                                               +vec2(0.3,0.5));
                        float space = 0.1;
                        x -= 0.1*sin(time*0.01)*1.0;
                        float v = (mod(x,space)/space > 0.9) ? 1.0 : 0.0;
                        float shift = 0.5;
                        float r = 0.03*v + sin(x );
                        float g = 0.03*v + sin(x + 3.14*2.0/4.0 * shift);
                        float b = 0.03*v + sin(x + 3.14*3.0/4.0 * shift);
                        float a = 1.0;
                        gl_FragColor = vec4(r, g, b, a);
                    }
                </script>
                <script>
                    document.addEventListener("touchstart", function(){}, true);

                    (function( global ) {

                        function Ugl( containerId, config ) {
                            this.config = config;
                            this.domContainer = document.getElementById(containerId);
                            this.containers = [];
                            this.createDomElements();
                            this.createRenderer();
                            return this;
                        }

                        Ugl.prototype.createDomElements = function() {
                            var scope = this;
                            var id = 'render';

                            this.containers[id] = document.createElement('div');

                            var width = getElementSize( this.domContainer ).width;
                            var height = this.config.container.height;

                            window.addEventListener( 'resize', function() { scope.onWindowResize(); }, false );

                            this.containers[id].style.webkitTouchCallout = 'none';
                            this.containers[id].style.webkitUserSelect = 'none';
                            this.containers[id].style.khtmlUserSelect = 'none';
                            this.containers[id].style.mozUserSelect = 'none';
                            this.containers[id].style.msUserSelect = 'none';
                            this.containers[id].style.oUserSelect = 'none';
                            this.containers[id].style.userSelect = 'none';

                            this.containers[id].style.webkitTapHighlightColor = 'transparent';
                            this.containers[id].style.height = height + 'px';
                            this.containers[id].style.position = 'relative';
                            this.containers[id].style.backgroundColor = 'transparent';

                            this.domContainer.appendChild( this.containers[id] )
                        };

                        Ugl.prototype.onWindowResize = function() {
                            var containerSize = getElementSize( this.domContainer );
                            var height = this.config.container.height;
                            this.uniforms.resolution.value.x = containerSize.width;
                            this.uniforms.resolution.value.y = height;
                            this.renderer.setSize( containerSize.width, height );
                        };

                        Ugl.prototype.createRenderer = function() {
                            var scope = this;

                            var width = getElementSize( this.domContainer ).width;
                            var height = this.config.container.height;

                            var uniforms = scope.uniforms = {
                                time: { type: "f", value: 1.0 },
                                resolution: { type: "v2", value: new THREE.Vector2() }
                            };
                            uniforms.resolution.value.x = width;
                            uniforms.resolution.value.y = height;

                            var material = new THREE.ShaderMaterial( {
                                uniforms: uniforms,
                                vertexShader: document.getElementById('vertex-shader').textContent,
                                fragmentShader: document.getElementById('fragment-shader').textContent
                            });

                            var mesh = new THREE.Mesh( new THREE.PlaneGeometry( 2, 2 ), material );

                            var scene = new THREE.Scene();
                            scene.add( mesh );

                            var camera = new THREE.Camera();
                            camera.position.z = 1;

                            this.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                            this.renderer.setPixelRatio( window.devicePixelRatio );
                            this.renderer.setSize( width, height );
                            this.renderer.setClearColor( 'black' );
                            this.renderer.render(scene, camera);

                            this.containers.render.appendChild( this.renderer.domElement );

                            var startTime = Date.now();
                            scope.render = function() {
                                var elapsedMilliseconds = Date.now() - startTime;
                                var elapsedSeconds = elapsedMilliseconds / 1000.;
                                scope.uniforms.time.value = elapsedSeconds;
                                scope.renderer.render( scene, camera );
                            }

                            scope.animate = function() {
                                requestAnimationFrame( scope.animate );
                                scope.render();
                            };

                            scope.animate();
                        }

                        Ugl.prototype.setFoo = function( val ) {
                            return ( this.foo = val );
                        };

                        var getElementSize = function( element ) {
                            if ( element.getBoundingClientRect != undefined )
                                return element.getBoundingClientRect();
                            else
                                return { width: element.offsetWidth, height: element.offsetHeight };
                        }

                        var ugl = function( containerId, config ) {
                            return new Ugl( containerId, config );
                        };

                        global.ugl = ugl;

                    })( this );

                    var config = {
                        container: {
                            height: 400
                        }
                    };

                    var t = ugl( 'ugl-container', config );
                </script>
            </article>
        </main>

        <footer>
            <p>&copy; 2025</p>
        </footer>
    </div>
</body>
</html>
