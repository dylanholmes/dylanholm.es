<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>double pendulum - dylanholm.es</title>
    <meta name="description" content="a chaotic double pendulum with live time series">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        #bg-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        #live-labels {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }

        .band-label {
            position: absolute;
            transform: translateY(-50%);
        }

        .band-label .katex {
            font-size: 1.4rem;
            color: #1a1a1a;
        }

        .angle-label {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }

        .angle-label .katex {
            font-size: 0.85rem;
            color: #1a1a1a;
        }
    </style>
</head>
<body style="position: relative;">
    <canvas id="bg-canvas"></canvas>

    <div id="live-labels">
        <div class="band-label" id="label-theta"></div>
        <div class="band-label" id="label-dtheta"></div>
        <div class="band-label" id="label-ddtheta"></div>
    </div>

    <div class="angle-label" id="angle-label-a"></div>
    <div class="angle-label" id="angle-label-b"></div>

    <div class="wrap">
        <header>
            <h1><a href="/">dylanholm.es</a></h1>
            <nav>
                <a href="/about.html">/about</a>
                <a href="/resume.html">/resume</a>
            </nav>
        </header>

        <main id="main">
            <article>
                <h2>double pendulum</h2>
                <p>two point masses on massless rods, swinging under gravity. the system is chaotic — small differences in initial conditions diverge exponentially.</p>
            </article>
        </main>

        <footer>
            <p>&copy; 2025 Dylan Holmes</p>
        </footer>
    </div>

    <script>
    (function() {
        'use strict';

        // --- Physics ---
        var G = 9.81, M_A = 1, M_B = 1, L_A = 1, L_B = 1;
        var DT = 1 / 60;

        var theta_a = Math.PI / 3, theta_b = Math.PI / 4;
        var dtheta_a = 0, dtheta_b = 0;
        var SUBSTEPS = 4;
        var ddtheta_a = 0, ddtheta_b = 0;

        // Circular buffer
        var N = 400;
        var buf = {
            ta: new Float32Array(N), tb: new Float32Array(N),
            da: new Float32Array(N), db: new Float32Array(N),
            dda: new Float32Array(N), ddb: new Float32Array(N)
        };
        var head = 0, bsize = 0;

        function fixRange(x) {
            return ((x + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
        }

        function substep(dt) {
            var a = theta_a, b = theta_b;
            var da = dtheta_a, db = dtheta_b;
            var s_ab = Math.sin(a - b), c_ab = Math.cos(a - b);
            var s_a = Math.sin(a), s_b = Math.sin(b), c_a = Math.cos(a);
            var da2 = da * da, db2 = db * db;

            var denom = M_A + M_B * s_ab * s_ab;

            ddtheta_a = (
                M_B * s_ab * c_ab * L_A * da2 +
                M_B * s_ab * L_B * db2 +
                ((M_A + M_B) * s_a - M_B * s_b * c_ab) * G
            ) / (-denom * L_A);

            ddtheta_b = (
                (M_A + M_B) * s_ab * L_A * da2 +
                M_B * s_ab * c_ab * L_B * db2 +
                (M_A + M_B) * s_ab * c_a * G
            ) / (denom * L_B);

            dtheta_a += ddtheta_a * dt;
            dtheta_b += ddtheta_b * dt;
            theta_a = fixRange(theta_a + dtheta_a * dt);
            theta_b = fixRange(theta_b + dtheta_b * dt);
        }

        function step() {
            var dt = DT / SUBSTEPS;
            for (var s = 0; s < SUBSTEPS; s++) {
                substep(dt);
            }

            buf.ta[head] = theta_a;   buf.tb[head] = theta_b;
            buf.da[head] = dtheta_a;  buf.db[head] = dtheta_b;
            buf.dda[head] = ddtheta_a; buf.ddb[head] = ddtheta_b;
            head = (head + 1) % N;
            if (bsize < N) bsize++;
        }

        // --- Layout ---
        // Time series bands: fraction of page height, positioned below pendulum
        var BANDS = [
            { y: 0.58 },  // theta
            { y: 0.70 },  // dtheta
            { y: 0.82 }   // ddtheta
        ];
        var BAND_HALF = 0.04;
        var SERIES_WIDTH = 0.45; // fraction of page width for curves

        // --- Canvas ---
        var canvas = document.getElementById('bg-canvas');
        var ctx = canvas.getContext('2d');

        var labelTheta = document.getElementById('label-theta');
        var labelDtheta = document.getElementById('label-dtheta');
        var labelDdtheta = document.getElementById('label-ddtheta');
        var angleLabelA = document.getElementById('angle-label-a');
        var angleLabelB = document.getElementById('angle-label-b');

        function resize() {
            var dpr = window.devicePixelRatio || 1;
            var w = document.documentElement.scrollWidth;
            var h = document.documentElement.scrollHeight;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            positionLabels();
        }
        resize();
        window.addEventListener('resize', resize);

        // --- Draw pendulum ---
        function getPendulumCenter() {
            var w = document.documentElement.scrollWidth;
            var h = document.documentElement.scrollHeight;
            return { x: w / 2, y: h * 0.38 };
        }

        function drawAngleArc(cx, cy, radius, theta) {
            // Canvas angles: 0 = right, PI/2 = down
            // Vertical (down) = PI/2, rod at angle theta from vertical = PI/2 - theta
            var vertAngle = Math.PI / 2;
            var rodAngle = Math.PI / 2 - theta;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, vertAngle, rodAngle, theta > 0);
            ctx.stroke();
        }

        function drawPendulum() {
            var center = getPendulumCenter();
            var w = document.documentElement.scrollWidth;
            var h = document.documentElement.scrollHeight;
            var scale = Math.min(w, h) * 0.06;

            var xa = scale * L_A * Math.sin(theta_a);
            var ya = scale * L_A * Math.cos(theta_a);
            var xb = xa + scale * L_B * Math.sin(theta_b);
            var yb = ya + scale * L_B * Math.cos(theta_b);

            var rodLen = scale * L_A;
            var arcRadius = rodLen * 0.4;

            // Dashed vertical reference lines
            ctx.save();
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 0.8;
            ctx.setLineDash([4, 4]);

            // Vertical from pivot
            ctx.beginPath();
            ctx.moveTo(center.x, center.y);
            ctx.lineTo(center.x, center.y + rodLen * 0.7);
            ctx.stroke();

            // Vertical from mass A
            ctx.beginPath();
            ctx.moveTo(center.x + xa, center.y + ya);
            ctx.lineTo(center.x + xa, center.y + ya + rodLen * 0.7);
            ctx.stroke();

            // Angle arcs
            ctx.lineWidth = 1;
            drawAngleArc(center.x, center.y, arcRadius, theta_a);
            drawAngleArc(center.x + xa, center.y + ya, arcRadius, theta_b);

            ctx.restore();

            // Rods
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(center.x, center.y);
            ctx.lineTo(center.x + xa, center.y + ya);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(center.x + xa, center.y + ya);
            ctx.lineTo(center.x + xb, center.y + yb);
            ctx.stroke();

            // Joints
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(center.x, center.y, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(center.x + xa, center.y + ya, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(center.x + xb, center.y + yb, 5, 0, Math.PI * 2);
            ctx.fill();

            // Position angle labels at the midpoint of each arc
            var labelDist = arcRadius + 12;
            var midA = theta_a / 2;
            var labelAx = center.x + labelDist * Math.sin(midA);
            var labelAy = center.y + labelDist * Math.cos(midA);
            angleLabelA.style.left = labelAx + 'px';
            angleLabelA.style.top = labelAy + 'px';

            var midB = theta_b / 2;
            var labelBx = center.x + xa + labelDist * Math.sin(midB);
            var labelBy = center.y + ya + labelDist * Math.cos(midB);
            angleLabelB.style.left = labelBx + 'px';
            angleLabelB.style.top = labelBy + 'px';
        }

        // --- Draw time series ---
        function drawBand(buf_a, buf_b, cy, halfH, left, right) {
            if (bsize < 2) return;

            var bandW = right - left;

            // Shared min/max
            var min = Infinity, max = -Infinity;
            for (var i = 0; i < bsize; i++) {
                var idx = (head - bsize + i + N) % N;
                var va = buf_a[idx], vb = buf_b[idx];
                if (va < min) min = va; if (va > max) max = va;
                if (vb < min) min = vb; if (vb > max) max = vb;
            }
            var range = max - min;
            if (range < 0.001) range = 1;
            var mid = (max + min) / 2;

            var colors = ['#1a1a1a', '#999'];
            var widths = [1.5, 1];
            var bufs = [buf_a, buf_b];

            for (var c = 0; c < 2; c++) {
                ctx.strokeStyle = colors[c];
                ctx.lineWidth = widths[c];
                ctx.beginPath();

                for (var j = 0; j < bsize; j++) {
                    var jdx = (head - bsize + j + N) % N;
                    var v = bufs[c][jdx];
                    // Left to right: oldest on left, newest on right
                    var x = left + (j / (N - 1)) * bandW;
                    var y = cy - ((v - mid) / range) * halfH;

                    if (j === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }

        function drawTimeSeries() {
            var w = document.documentElement.scrollWidth;
            var h = document.documentElement.scrollHeight;
            var halfH = h * BAND_HALF;

            // Centered horizontally
            var seriesW = w * SERIES_WIDTH;
            var left = (w - seriesW) / 2;
            var right = left + seriesW;

            var pairs = [
                [buf.ta, buf.tb],
                [buf.da, buf.db],
                [buf.dda, buf.ddb]
            ];

            for (var b = 0; b < 3; b++) {
                drawBand(pairs[b][0], pairs[b][1], h * BANDS[b].y, halfH, left, right);
            }
        }

        // --- Labels ---
        function positionLabels() {
            var w = document.documentElement.scrollWidth;
            var h = document.documentElement.scrollHeight;
            var seriesW = w * SERIES_WIDTH;
            var left = (w - seriesW) / 2;

            var labels = [labelTheta, labelDtheta, labelDdtheta];
            for (var i = 0; i < 3; i++) {
                labels[i].style.left = (left - 60) + 'px';
                labels[i].style.top = (h * BANDS[i].y) + 'px';
            }
        }

        // Render labels once
        function renderLabels() {
            if (!window.katex) return;
            katex.render('\\theta', labelTheta, {throwOnError: false});
            katex.render('\\dot{\\theta}', labelDtheta, {throwOnError: false});
            katex.render('\\ddot{\\theta}', labelDdtheta, {throwOnError: false});
            katex.render('\\theta_a', angleLabelA, {throwOnError: false});
            katex.render('\\theta_b', angleLabelB, {throwOnError: false});
        }

        // --- Main loop ---
        function frame() {
            step();

            var w = document.documentElement.scrollWidth;
            var h = document.documentElement.scrollHeight;
            ctx.clearRect(0, 0, w, h);

            drawPendulum();
            drawTimeSeries();

            requestAnimationFrame(frame);
        }

        // --- Init ---
        renderLabels();
        positionLabels();
        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
